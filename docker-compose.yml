version: "3.9"

# Phase 0 scope: infrastructure services only. App containers (api, web)
# are intentionally NOT defined yet -- during development, run the API
# and web app locally against these composed services (see README.md).
# App containers will be added once there's a real app to containerize
# usefully (post-MVP polish phase), not before.

services:
  postgres:
    image: postgres:16
    container_name: echo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: echo
      POSTGRES_DB: echo
    ports:
      - "5432:5432"
    volumes:
      - echo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echo -d echo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: echo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - echo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  echo_postgres_data:
  echo_redis_data:
